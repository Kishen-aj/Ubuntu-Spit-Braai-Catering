backend:
  name: github
  repo: Kishen-aj/Ubuntu-Spit-Braai-Catering
  branch: main
  base_url: https://ubuntu-auth.kjurakan.workers.dev
  site_domain: ubuntucatering.co.za

media_folder: "Gallery Images"
public_folder: "Gallery Images"

collections:
  - name: "settings"
    label: "Website Settings"
    files:
      - file: "gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            field: {label: "Photo", name: "image", widget: "image"}
            
      # --- NEW: Social Links Section ---
      - file: "links.json"
        label: "Social & Contact Links"
        name: "links"
        fields:
          - {label: "WhatsApp Number (Format: 27812345678)", name: "whatsapp", widget: "string"}
          - {label: "Instagram Link", name: "instagram", widget: "string"}
          - {label: "Facebook Link", name: "facebook", widget: "string"}
          - {label: "TikTok Link", name: "tiktok", widget: "string"}